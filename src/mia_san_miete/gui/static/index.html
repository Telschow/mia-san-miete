// ---------- state & routing ----------

// ---------- charts ----------
function hbars(rows, color) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return h("div", { class: "bars" }, rows.map(r => h("div", { class: "brow", "data-tip": `${r.label}: ${r.value}` },
    h("span", {}, r.label),
    h("div", { class: "tr" }, h("div", { class: "fill", style: `width:${(r.value / max) * 100}%;background:${r.color || color || "var(--seq)"}` })),
    h("span", { class: "val" }, r.value))));
}
function columns(daily) {
  const W = 520, H = 170, pad = { l: 28, r: 6, t: 8, b: 24 };
  const max = Math.max(1, ...daily.map(d => d.total));
  const bw = (W - pad.l - pad.r) / daily.length;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Flats processed per day" });
  const ticks = [0, Math.ceil(max / 2), max];
  for (const t of [...new Set(ticks)]) {
    const y = pad.t + (H - pad.t - pad.b) * (1 - t / max);
    svg.append(s("g", { class: "axis" }, s("line", { x1: pad.l, x2: W - pad.r, y1: y, y2: y }), s("text", { x: pad.l - 6, y: y + 4, "text-anchor": "end" }, t)));
  }
  daily.forEach((d, i) => {
    const ch = (H - pad.t - pad.b) * (d.total / max);
    const w = bw * 0.6, x = pad.l + i * bw + (bw - w) / 2, y = H - pad.b - ch;
    const label = new Date(d.day + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const g = s("g", { "data-tip": `${label}: ${d.total} flats` });
    g.append(s("rect", { x: pad.l + i * bw, y: pad.t, width: bw, height: H - pad.t - pad.b, fill: "transparent" }));
    if (d.total) g.append(s("path", { d: `M${x},${H - pad.b} V${y + 3} q0,-3 3,-3 h${w - 6} q3,0 3,3 V${H - pad.b} z`, fill: "var(--seq)" }));
    svg.append(g);
    if (i % 2 === 0 || daily.length < 9) svg.append(s("text", { x: x + w / 2, y: H - 6, "text-anchor": "middle" }, label));

      h("div", { class: "card" }, h("h3", {}, "Flats per day"), h("div", { class: "sub" }, "Last 15 days, all decisions"), columns(overview.daily)),
      h("div", { class: "card" }, h("h3", {}, "What happened to each flat"), h("div", { class: "sub" }, "Latest decision per action"), funnel.length ? hbars(funnel) : h("div", { class: "empty" }, "No decisions yet")),
      h("div", { class: "card" }, h("h3", {}, "Replies by type"), h("div", { class: "sub" }, totalReplies ? `${totalReplies} replies matched to sent messages. "Needs a look" means the keyword classifier found no clear signal, so read those yourself.` : "No replies yet"),
        totalReplies ? [hbars(cats), h("div", { class: "legend" }, cats.map(c => h("span", {}, h("i", { style: `background:${c.color}` }), `${c.label} ${c.value}`)))] : null),
      h("div", { class: "card" }, h("h3", {}, "By source"), h("div", { class: "sub" }, "Sent messages and their outcomes"),

// ---------- queue ----------
let qSel = 0;
async function viewQueue() {

        h("div", { style: "flex:1;min-width:200px" }, h("h3", {}, (it.kind === "reply" ? "Reply to landlord: " : "") + (l.title || it.source)),
          h("div", { class: "facts" }, [l.warm_rent_eur != null ? eur(l.warm_rent_eur) + " warm" : null, l.area_m2 ? l.area_m2 + " m²" : null, l.rooms ? l.rooms + " rooms" : null, l.district || l.postal_code, it.source].filter(Boolean).join(" · "))),

}
document.addEventListener("keydown", e => {
  if (tab !== "queue" || /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) || !window._queueItems) return;
  const n = window._queueItems.length;
  if (e.key === "ArrowDown") qSel = Math.min(n - 1, qSel + 1);
  else if (e.key === "ArrowUp") qSel = Math.max(0, qSel - 1);
  else if (e.key.toLowerCase() === "a") { $(`[data-qi="${qSel}"] .primary`)?.click(); return; }
  else if (e.key.toLowerCase() === "s") { $(`[data-qi="${qSel}"] .btn:not(.primary)`)?.click(); return; }
  else return;
  document.querySelectorAll("[data-qi]").forEach(c => c.style.outline = +c.dataset.qi === qSel ? "2px solid var(--accent)" : "");
  $(`[data-qi="${qSel}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
  e.preventDefault();

function commuteBlock(c) {

    const verdict = v == null ? "? unknown" : v <= limit ? "✓ within limit" : v <= limit + c.margin ? `~ ${Math.round(v - limit)} min over (borderline)` : `✕ ${Math.round(v - limit)} min over`;

      h("div", { class: "top" }, h("span", {}, h("b", {}, t.name), mode === "pt" ? " · public transport" : " · car"), h("span", {}, v == null ? "unknown" : Math.round(v) + " min")),
      h("div", { class: "ctrack" }, v == null ? null : h("div", { class: "cfill" + (v > limit ? " over" : ""), style: `width:${Math.min(100, (v / scale) * 100)}%` }), h("div", { class: "climit", style: `left:${(limit / scale) * 100}%` })),
      h("div", { class: "cnote" }, `Limit ${limit} min (marker) · ${verdict}`)));
  }

  if (a) {
    const bar = (title, v, limit, unit, extra) => {
      const scale = Math.max(limit ? limit * 1.6 : 1, v || 0, 1);
      const verdict = v == null ? "? unknown" : !limit ? "" : v <= limit ? "✓ within limit" : `✕ ${(v - limit).toFixed(1)} ${unit} over`;
      return h("div", { class: "crow", "data-tip": `${title}: ${v == null ? "unknown" : v.toFixed(1) + " " + unit}` },
        h("div", { class: "top" }, h("span", {}, h("b", {}, title), extra || ""), h("span", {}, v == null ? "unknown" : (unit === "km" ? v.toFixed(1) : Math.round(v)) + " " + unit)),
        h("div", { class: "ctrack" }, v == null ? null : h("div", { class: "cfill" + (limit && v > limit ? " over" : ""), style: `width:${Math.min(100, (v / scale) * 100)}%` }), limit ? h("div", { class: "climit", style: `left:${(limit / scale) * 100}%` }) : null),
        h("div", { class: "cnote" }, (limit ? `Limit ${limit} ${unit} (marker) · ` : "") + verdict));

}

function breakdownBars(bd) {
  const rows = Object.entries(bd || {}).map(([k, v]) => ({ label: k.replace(/_/g, " "), value: Math.round(v.value * 100), w: v.weight }));
  if (!rows.length) return null;
  return h("div", { class: "bars" }, rows.map(r => h("div", { class: "brow", "data-tip": `${r.label}: ${r.value}% of full marks, weight ${r.w}` },
    h("span", {}, r.label), h("div", { class: "tr" }, h("div", { class: "fill", style: `width:${r.value}%` })), h("span", { class: "val" }, r.value + "%"))));
}

// ---------- listings ----------
async function viewListings() {
  const rows = await api("/api/listings" + (listFilter ? "?status=" + encodeURIComponent(listFilter) : ""));
  const statuses = [null, "queued", "sent", "skipped", "shadow_would_send"];
  const filters = h("div", { class: "filters" }, statuses.map(f => h("button", { class: "chip", "aria-pressed": listFilter === f, onclick: () => { listFilter = f; render(); } }, f ? statusLabel(f)[1] : "All")));
  if (!rows.length) return h("div", {}, filters, h("div", { class: "card empty" }, "No flats here yet."));
  return h("div", {}, filters, h("div", { class: "scroll-x" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Flat"), h("th", { class: "hide-sm" }, "Source"), h("th", { class: "num" }, "Rent"), h("th", { class: "num hide-sm" }, "Size"), h("th", {}, "Status"), h("th", { class: "num" }, "Score"))),
    h("tbody", {}, rows.map(r => h("tr", { tabindex: "0", onclick: () => openDrawer(r.id), onkeydown: e => e.key === "Enter" && openDrawer(r.id) },
      h("td", {}, h("div", { style: "font-weight:550" }, r.title || r.source), h("div", { class: "hint" }, [r.district, when(r.at)].filter(Boolean).join(" · "))),
      h("td", { class: "hide-sm" }, r.source), h("td", { class: "num" }, eur(r.warm_rent_eur ?? r.cold_rent_eur)),
      h("td", { class: "num hide-sm" }, r.area_m2 ? r.area_m2 + " m²" : "n/a"), h("td", {}, statusEl(r.status)),
      h("td", { class: "num" }, h("span", { class: "score" }, r.score == null ? "–" : Math.round(r.score)))))))));
}

async function openDrawer(id) {
  const d = await api("/api/listing/" + id);
  const l = d.listing, dr = $("#drawer");
  const rows = [["Rent (warm / cold)", `${eur(l.warm_rent_eur)} / ${eur(l.cold_rent_eur)}`], ["Size", l.area_m2 ? `${l.area_m2} m² · ${l.rooms ?? "?"} rooms` : "n/a"],
    ["Location", [l.street, l.postal_code, l.district].filter(Boolean).join(", ") || "n/a"], ["Available from", l.available_from || (l.available_immediately ? "immediately" : "n/a")],
    ["Landlord", l.landlord_type], ["Source", l.source], ["Score", d.score == null ? "n/a" : `${Math.round(d.score)} (v${d.score_version})`]];
  dr.replaceChildren(
    h("div", { class: "actions", style: "justify-content:space-between;margin-bottom:8px" }, statusEl(d.status), h("button", { class: "btn", onclick: closeDrawer }, "Close ✕")),
    h("h2", {}, l.title || "Flat"),
    h("p", { class: "hint" }, "Listing text comes from the portal; treat it as untrusted."),
    h("dl", { class: "kv" }, rows.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])),
    d.reasons.length ? h("div", { class: "reasons", style: "margin:14px 0" }, d.reasons.map(r => h("span", { class: "chip" }, r))) : null,
    h("h3", { style: "margin:16px 0 8px;font-size:14px" }, "Commute"), commuteBlock(d.commute),
    h("h3", { style: "margin:16px 0 8px;font-size:14px" }, "Score breakdown"), breakdownBars(d.breakdown) || h("div", { class: "hint" }, "No breakdown stored."),
    h("h3", { style: "margin:16px 0 8px;font-size:14px" }, "History"),
    h("ul", { class: "tl" }, d.history.map(x => h("li", {}, when(x.at) + " · " + statusLabel(x.status)[1]))),
    l.url ? h("p", {}, h("a", { class: "btn", href: l.url, target: "_blank", rel: "noopener noreferrer" }, "Open listing ↗")) : null);
  $("#drawerBg").classList.add("open");
}
function closeDrawer() { $("#drawerBg").classList.remove("open"); }
$("#drawerBg").addEventListener("click", e => { if (e.target.id === "drawerBg") closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ---------- settings ----------
async function viewSettings() {
  if (appState && appState.editable) { const editor = await viewSettingsEditor(appState); if (editor) return editor; }
  const c = await api("/api/settings");
  const sec = (title, obj) => h("div", { class: "card" }, h("h3", {}, title), h("dl", { class: "kv", style: "margin-top:10px" },
    Object.entries(obj).flatMap(([k, v]) => [h("dt", {}, k.replace(/_/g, " ")), h("dd", {}, typeof v === "object" && v !== null ? JSON.stringify(v) : String(v))])));
  return h("div", {}, h("p", { class: "hint" }, "Read-only view of the effective settings. Workplaces, addresses, names and credentials are never shown here. Edit config.yaml to change anything."),
    h("div", { class: "grid cols" }, sec("Search criteria", c.criteria), sec("Send policy", c.send_policy), sec("Commute", c.commute), sec("Score weights", c.scoring_weights)));
}

let appState = null;
async function boot() {
  try { appState = await api("/api/state"); }
  catch (e) { $("#main").replaceChildren(h("div", { class: "empty" }, "Could not reach the dashboard API: " + e.message)); return; }
  if (appState.setup) {
    for (const id of ["#tabs", "#chips", "#demoChip"]) $(id).replaceChildren();
    $("#killBtn").style.display = "none";
    $("#main").replaceChildren(viewSetup());
    return;
  }
  $("#killBtn").style.display = "";
  await refresh();
}
boot();
setInterval(() => { if (!appState || appState.setup || tab === "settings" || document.visibilityState !== "visible" || document.activeElement.matches("textarea,input")) return; api("/api/overview").then(o => { const changed = JSON.stringify(o) !== JSON.stringify(overview); overview = o; if (changed && !$("#drawerBg").classList.contains("open")) render(); }).catch(() => {}); }, 15000);
</script>
</body>
