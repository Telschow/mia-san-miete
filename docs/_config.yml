title: Mia san Miete
description: A personal agent for the German rental market. Finds, scores and drafts; you stay in control.
lang: en
markdown: kramdown
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - config.schema.json
  - _preview
